name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验解法提交
        run: python3 -I release/tools/check_submissions.py --root .
