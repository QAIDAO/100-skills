<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="B11-mechanism-title B11-mechanism-desc"><title id="B11-mechanism-title">B11 对接：把空间匹配写成图问题</title><desc id="B11-mechanism-desc">对接：把空间匹配写成图问题；候选接触节点；相容性边；可行接触子图；匹配子图 → 候选姿态；先抽图，再重建分子姿态；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">B11 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">对接：把空间匹配写成图问题</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><line x1="113" y1="213" x2="202" y2="154" stroke="#dfd5ea" stroke-width="3" /><line x1="113" y1="213" x2="204" y2="285" stroke="#dfd5ea" stroke-width="3" /><line x1="202" y1="154" x2="299" y2="205" stroke="#dfd5ea" stroke-width="3" /><line x1="204" y1="285" x2="299" y2="205" stroke="#dfd5ea" stroke-width="3" /><line x1="299" y1="205" x2="375" y2="142" stroke="#dfd5ea" stroke-width="3" /><line x1="299" y1="205" x2="426" y2="248" stroke="#dfd5ea" stroke-width="3" /><line x1="375" y1="142" x2="426" y2="248" stroke="#dfd5ea" stroke-width="3" /><line x1="426" y1="248" x2="345" y2="324" stroke="#dfd5ea" stroke-width="3" /><line x1="204" y1="285" x2="345" y2="324" stroke="#dfd5ea" stroke-width="3" /><path d="M 299 205 L 375 142 L 426 248 Z" fill="#9c71cf12" stroke="#9c71cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="113" cy="213" r="19" fill="#8250cf" stroke="none" stroke-width="2"/><text x="113" y="218" font-size="15" fill="#fff" text-anchor="middle" font-weight="500">1</text><circle cx="202" cy="154" r="19" fill="#9c71cf" stroke="none" stroke-width="2"/><text x="202" y="159" font-size="15" fill="#fff" text-anchor="middle" font-weight="500">2</text><