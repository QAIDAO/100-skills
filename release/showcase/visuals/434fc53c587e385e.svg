<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 98 509 306" role="img"><title id="M13-mechanism-title">M13 手性催化：筛出决定选择性的构型</title><desc id="M13-mechanism-desc">手性催化：筛出决定选择性的构型；手性铁催化中心；竞争通道 R；竞争通道 S；ΔΔE‡ = E‡R − E‡S；先筛选，再使用逻辑量子资源；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">M13 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">手性催化：筛出决定选择性的构型</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><circle cx="142" cy="242" r="41" fill="#8250cf" stroke="none" stroke-width="2"/><text x="142" y="247" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">Fe</text><line x1="193" y1="225" x2="298" y2="172" stroke="#9c71cf" stroke-width="2.3" /><path d="M 292.8933887060517 179.4109730192816 L 298 172 L 289.0047673777878 171.70710057649464" fill="none" stroke="#9c71cf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><line x1="193" y1="259" x2="298" y2="312" stroke="#587e78" stroke-width="2.3" /><path d="M 289.0047673777878 312.2928994235054 L 298 312 L 292.8933887060517 304.5890269807184" fill="none" stroke="#587e78" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><rect x="310" y="140" width="160" height="66" rx="12" fill="#eee7ff" stroke="#9c71cf"/><rect x="310" y="281" width="160" height="66" rx="12" fill="#e3f3ef" stroke="#587e78"/><text x="390" y="179" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">R 通道</text><text x="390" y="320" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">S 通道</text><circle cx="101" cy="182" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="101" y="187" font-size="14" fill="#9c71cf" text-anchor="middle" font