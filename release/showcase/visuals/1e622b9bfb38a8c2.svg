<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 98 509 306" role="img"><title id="M20-mechanism-title">M20 限域分子：稳定性与模型的边界</title><desc id="M20-mechanism-desc">限域分子：稳定性与模型的边界；亚稳环状分子；限域环境近似；电子与核效应；E = Eref + δEcorr + δEenv；属于探索性稳定性问题；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">M20 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">限域分子：稳定性与模型的边界</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><circle cx="211" cy="240" r="105" fill="#edf3ff" stroke="#8250cf" stroke-width="2"/><ellipse cx="211" cy="240" rx="64" ry="105" fill="none" stroke="#dfd5ea" stroke-width="2"/><ellipse cx="211" cy="240" rx="105" ry="43" fill="none" stroke="#dfd5ea" stroke-width="2"/><path d="M 185 262 L 211 202 L 240 262 Z" fill="none" stroke="#9c71cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="185" cy="262" r="13" fill="#9c71cf" stroke="none" stroke-width="2"/><text x="185" y="267" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">O</text><circle cx="211" cy="202" r="13" fill="#9c71cf" stroke="none" stroke-width="2"/><text x="211" y="207" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">O</text><circle cx="240" cy="262" r="13" fill="#9c71cf" stroke="none" stroke-width="2"/><text x="240" y="267" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">O</text><line x1="333" y1="241" x2="374" y2="241" stroke="#587e78" stroke-width="2.3" /><path d="M 366.10175694298664 245.31482984743784 L 374 241 L 366.10175694298664 236.68517015256216" fill="none" stroke="#587e78" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><rect x="389" y="176" width="108" height="132" rx="12" fill="#e3f3ef" stroke="#587e78"/><text x="443" y="218" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">电子态</text><text x="443" y="257" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">核效应</text><text x="443" y="291" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">环境项</text><text x="281" y="384" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">笼形环境只是模型示意</text><circle cx="82" cy="177" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="82" y="182" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="291" cy="153" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="291" y="158" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="496" cy="160" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="496" y="165" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">亚稳环状分子</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">限域环境近似</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">电子与核效应</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="start" font-weight="650">E = Eref + δEcorr + δEenv</text><text x="30" y="485" font-size="18" fill="#38264f" text-anchor="start" font-weight="500">属于探索性稳定性问题</text><text x="30" y="507" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="500">原创机制示意；非论文实测曲线。完整证据与来源见本案正文。</text></g></svg>