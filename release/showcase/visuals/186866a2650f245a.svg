<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 98 509 306" role="img"><title id="F13-mechanism-title">F13 Bethe 晶格：小杂质的自洽反馈</title><desc id="F13-mechanism-desc">Bethe 晶格：小杂质的自洽反馈；离散浴位点；单杂质；杂化函数反馈；Δnew ← 自洽映射(Gimp)；用五比特平台检验闭环；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">F13 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">Bethe 晶格：小杂质的自洽反馈</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><line x1="127" y1="236" x2="281" y2="235" stroke="#dfd5ea" stroke-width="3" /><circle cx="127" cy="236" r="24" fill="#edf3ff" stroke="#8250cf" stroke-width="2"/><text x="127" y="241" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">浴</text><circle cx="281" cy="235" r="43" fill="#eee7ff" stroke="#9c71cf" stroke-width="2"/><text x="281" y="242" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">杂质</text><path d="M 107 267 Q 79 382 291 376 Q 517 376 468 231" fill="none" stroke="#587e78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="285" y="360" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">经典自洽反馈</text><circle cx="82" cy="225" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="82" y="230" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="284" cy="173" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="284" y="178" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="499" cy="345" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="499" y="350" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><rect x="381" y="151" width="122" height="65" rx="12" fill="#e3f3ef" stroke="#587e78"/><text x="442" y="179" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">Δ 更新</text><text x="442" y="202" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">经典端</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">离散浴位点</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">单杂质</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">杂化函数反馈</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="start" font-weight="650">Δnew ← 自洽映射(Gimp)</text><text x="30" y="485" font-size="18" fill="#38264f" text-anchor="start" font-weight="500">用五比特平台检验闭环</text><text x="30" y="507" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="500">原创机制示意；非论文实测曲线。完整证据与来源见本案正文。</text></g></svg>