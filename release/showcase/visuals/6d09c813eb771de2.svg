<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="F15-mechanism-title F15-mechanism-desc"><title id="F15-mechanism-title">F15 Krylov 采样必须覆盖响应扇区</title><desc id="F15-mechanism-desc">Krylov 采样必须覆盖响应扇区；N 粒子采样；N+1 响应扇区；N−1 响应扇区；Krylov → 投影 H → G(ω)；基态支撑不保证响应支撑；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">F15 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">Krylov 采样必须覆盖响应扇区</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><circle cx="275" cy="221" r="47" fill="#edf3ff" stroke="#8250cf" stroke-width="2"/><text x="275" y="229" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">N</text><rect x="70" y="306" width="146" height="64" rx="12" fill="#eee7ff" stroke="#9c71cf"/><rect x="343" y="306" width="146" height="64" rx="12" fill="#e3f3ef" stroke="#587e78"/><text x="143" y="345" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">N − 1</text><text x="416" y="345" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">N + 1</text><line x1="239" y1="258" x2="174" y2="299" stroke="#9c71cf" stroke-width="2.3" /><path d="M 178.37834179936468 291.13678671992574 L 174 299 L 182.98229399261422 298.4357353189799" fill="none" stroke="#9c71cf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><line x1="311" y1="258" x2="381" y2="299" stroke="#587e78" stroke-width="2.3" /><path d="M 372.00400905358885 298.7313982649198 L 381 299 L 376.3654659146242 291.2850085021764" fill="none" stroke="#587e78" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><text x="174" y="270" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">c</text><text x="381" y="270" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">c†</text><text x="275" y="150" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">增减一个粒子的响应</text><circle cx="222" cy="183" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="222" y="188" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="489" cy="304" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="489" y="309" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="72" cy="304" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="72" y="309" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">N 粒子采样</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">N+1 响应扇区</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">N−1 响应扇区</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="start" font-weight="650">Krylov → 投影 H → G(ω)</text><text x="30" y="485" font-size="18" fill="#38264f" text-anchor="start" font-weight="500">基态支撑不保证响应支撑</text><text x="30" y="507" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="500">原创机制示意；非论文实测曲线。完整证据与来源见本案正文。</text></g></svg>