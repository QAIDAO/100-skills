4" fill="#fff" text-anchor="middle" font-weight="500">A</text><text x="278" y="381" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">增长概率 → 群体分布 → 有限统计</text><circle cx="53" cy="207" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="53" y="212" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="258" cy="148" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="258" y="153" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="492" cy="274" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="492" y="279" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">单体增长</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">序列树</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">统计量读出</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="st