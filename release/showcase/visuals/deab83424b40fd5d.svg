<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="F07-mechanism-title F07-mechanism-desc"><title id="F07-mechanism-title">F07 锥形交叉附近的非绝热转移</title><desc id="F07-mechanism-desc">锥形交叉附近的非绝热转移；两电子态；核坐标上的能面；绕行与几何相位；电子态 ↔ 核坐标耦合；交叉邻域中电子与核运动耦合；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">F07 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">锥形交叉附近的非绝热转移</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><path d="M 113 135 L 285 248 L 457 135 Q 285 206 113 135" fill="#eee7ff" stroke="#9c71cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 113 360 L 285 248 L 457 360 Q 285 287 113 360" fill="#e1ecff" stroke="#8250cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="285" cy="248" rx="125" ry="36" fill="none" stroke="#587e78" stroke-width="3" stroke-dasharray="6 5"/><circle cx="285" cy="248" r="7" fill="#38264f" stroke="none" stroke-width="2"/><circle cx="379" cy="272" r="16" fill="#587e78" stroke="none" stroke-width="2"/><text x="379" y="277" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">ψ</text><text x="277" y="391" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">交叉邻域 · 几何关系示意</text><circle cx="122" cy="178" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="122" y="183" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="469" cy="341" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="469" y="346" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="415" cy="253" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="415" y="258" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">两电子态</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">核坐标上的能面</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">绕行与几何相位</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="start" font-weight="650">电子态 ↔ 核坐标耦合</text><text x="30" y="485" font-size="18" fill="#38264f" text-anchor="start" font-weight="500">交叉邻域中电子与核运动耦合</text><text x="30" y="507" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="500">原创机制示意；非论文实测曲线。完整证据与来源见本案正文。</text></g></svg>