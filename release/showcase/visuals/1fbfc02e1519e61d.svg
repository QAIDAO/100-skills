<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="B13-mechanism-title B13-mechanism-desc"><title id="B13-mechanism-title">B13 LOX：电子势能面与核隧穿是两层</title><desc id="B13-mechanism-desc">LOX：电子势能面与核隧穿是两层；供体与受体；电子转移；H / D 核运动；KIE = kH / kD；电子能修正之后仍需核动力学；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">B13 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">LOX：电子势能面与核隧穿是两层</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><circle cx="130" cy="232" r="39" fill="#8250cf" stroke="none" stroke-width="2"/><text x="130" y="237" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">D</text><circle cx="436" cy="232" r="39" fill="#587e78" stroke="none" stroke-width="2"/><text x="436" y="237" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">A</text><path d="M 165 218 Q 280 108 400 218" fill="none" stroke="#9c71cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="280" y="157" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">电子 e⁻</text><line x1="183" y1="266" x2="380" y2="266" stroke="#587e78" stroke-width="2.3" /><path d="M 372.10175694298664 270.3148298474378 L 380 266 L 372.10175694298664 261.6851701525622" fill="none" stroke="#587e78" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="266" r="23" fill="#587e78" stroke="none" stroke-width="2"/><text x="280" y="271" font-size="12" fill="#fff" text-anchor="middle" font-weight="650">H/D</text><text x="280" y="327" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">电子势面 → 核运动 → 速率</text><circle cx="91" cy="171" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="91" y="176" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><circle cx="280" cy="129" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="280" y="134" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><circle cx="326" cy="286" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="326" y="291" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">供体与受体</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">电子转移</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#9c71cf" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#9c71cf" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#38264f" text-anchor="start" font-weight="600">H / D 核运动</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dfd5ea" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dfd5ea" stroke-width="2" /><text x="30" y="453" font-size="22" fill="#9c71cf" text-anchor="start" font-weight="650">KIE = kH / kD</text><text x="30" y="485" font-size="18" fill="#38264f" text-anchor="start" font-weight="500">电子能修正之后仍需核动力学</text><text x="30" y="507" font-size="12" fill="#5b6b8