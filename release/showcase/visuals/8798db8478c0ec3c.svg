<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="M19-mechanism-title M19-mechanism-desc"><title id="M19-mechanism-title">M19 合成固氮：通向氰酸盐的反应账本</title><desc id="M19-mechanism-desc">合成固氮：通向氰酸盐的反应账本；Mo–PNP 中心；C–N 成键；竞争电子态；ΔE = Eproducts − Ereactants；产品与决策不同于固氮酶合成氨；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dfd5ea"/><text x="30" y="34" font-size="13" fill="#8250cf" text-anchor="start" font-weight="700">M19 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#38264f" text-anchor="start" font-weight="700">合成固氮：通向氰酸盐的反应账本</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f5f0fb" stroke="none"/><rect x="70" y="156" width="133" height="177" rx="12" fill="#edf3ff" stroke="#8250cf"/><text x="136" y="193" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">合成催化</text><circle cx="136" cy="239" r="24" fill="#8250cf" stroke="none" stroke-width="2"/><text x="136" y="244" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">Mo</text><text x="136" y="303" font-size="16" fill="#8250cf" text-anchor="middle" font-weight="650">PNP 配体</text><line x1="220" y1="238" x2="302" y2="238" stroke="#9c71cf" stroke-width="2.3" /><path d="M 294.10175694298664 242.31482984743784 L 302 238 L 294.10175694298664 233.68517015256216" fill="none" stroke="#9c71cf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><rect x="322" y="142" width="172" height="66" rx="12" fill="#eee7ff" stroke="#9c71cf"/><text x="408" y="182" font-size="16" fill="#9c71cf" text-anchor="middle" font-weight="650">N₂ 活化</text><rect x="322" y="280" width="172" height="66" rx="12" fill="#e3f3ef" stroke="#587e78"/><text x="408" y="321" font-size="16" fill="#587e78" text-anchor="middle" font-weight="650">C–N 成键</text><line x1="407" y1="221" x2="407" y2="267