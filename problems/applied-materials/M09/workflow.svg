<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="M09-workflow-title M09-workflow-desc"><title id="M09-workflow-title">M09 从研究对象到可核验的结果</title><desc id="M09-workflow-desc">1 经典计算：宿主与缺陷嵌入；2 经典计算：高精度经典求解；3 量子方法：未来 QPU 接口；4 测量 / 验证：能级及模型收敛；不代表计算已由 QPU 完成</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dce5f3"/><text x="30" y="34" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">M09 / COMPUTE &amp; VALIDATE</text><text x="30" y="74" font-size="25" fill="#14213d" text-anchor="start" font-weight="700">从研究对象到可核验的结果</text><rect x="30" y="113" width="360" height="136" rx="10" fill="#fff" stroke="#dce5f3"/><circle cx="59" cy="141" r="13" fill="#2563eb" stroke="none" stroke-width="2"/><text x="59" y="146" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="81" y="147" font-size="15" fill="#2563eb" text-anchor="start" font-weight="650">经典计算</text><text x="51" y="192" font-size="20" fill="#14213d" text-anchor="start" font-weight="650">宿主与缺陷嵌入</text><text x="52" y="230" font-size="14" fill="#5b6b88" text-anchor="start" font-weight="500">输入、后处理或数值模型</text><rect x="450" y="113" width="360" height="136" rx="10" fill="#fff" stroke="#dce5f3"/><circle cx="479" cy="141" r="13" fill="#2563eb" stroke="none" stroke-width="2"/><text x="479" y="146" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="501" y="147" font-size="15" fill="#2563eb" text-anchor="start" font-weight="650">经典计算</text><text x="471" y="192" font-size="20" fill="#14213d" text-anchor="start" font-weight="650">高精度经典求解</text><text x="472" y="230" font-size="14" fill="#5b6b88" text-anchor="start" font-weight="500">输入、后处理或数值模型</text><rect x="450" y="287" width="360" height="136" rx="10" fill="#fff" stroke="#dce5f3"/><circle cx="479" cy="315" r="13" fill="#7c3aed