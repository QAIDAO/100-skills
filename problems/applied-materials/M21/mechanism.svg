<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="M21-mechanism-title M21-mechanism-desc"><title id="M21-mechanism-title">M21 C–F 断裂：每个键长都要验收</title><desc id="M21-mechanism-desc">C–F 断裂：每个键长都要验收；C–F 拉伸；代理与本体区分；全曲线误差；ΔE(r) = E(r) − E(rref)；不能用平衡点误差代表整条曲线；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dce5f3"/><text x="30" y="34" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">M21 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#14213d" text-anchor="start" font-weight="700">C–F 断裂：每个键长都要验收</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f8faff" stroke="none"/><circle cx="111" cy="194" r="24" fill="#2563eb" stroke="none" stroke-width="2"/><text x="111" y="199" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">C</text><line x1="145" y1="194" x2="236" y2="194" stroke="#7c3aed" stroke-width="4" /><circle cx="269" cy="194" r="24" fill="#087e81" stroke="none" stroke-width="2"/><text x="269" y="199" font-size="15" fill="#fff" text-anchor="middle" font-weight="650">F</text><line x1="151" y1="236" x2="230" y2="236" stroke="#7c3aed" stroke-width="2.3" /><path d="M 222.10175694298664 240.31482984743784 L 230 236 L 222.10175694298664 231.68517015256216" fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><text x="193" y="265" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="650">r(C–F)</text><rect x="346" y="145" width="150" height="169" rx="12" fill="#fff" stroke="#dce5f3"/><text x="421" y="180" font-size="16" fill="#087e81" text-anchor="middle" font-weight="650">逐点核查</text><text x="421" y="222" font-size="16" fill="#5b6b88" text-anchor="middle" font-weight="650">平衡点</text><text x="421" y="261" font-size="16" fill="#5b6b88" text-anchor="middle" fon