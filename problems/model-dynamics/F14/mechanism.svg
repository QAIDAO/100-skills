<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="F14-mechanism-title F14-mechanism-desc"><title id="F14-mechanism-title">F14 基态能量之外：粒子与空穴响应</title><desc id="F14-mechanism-desc">基态能量之外：粒子与空穴响应；N 粒子基态；N+1 粒子扇区；N−1 空穴扇区；A(ω) = −Im G(ω) / π；谱权重也要单独验收；图形不含实测数值。</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dce5f3"/><text x="30" y="34" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">F14 / OBJECT &amp; MECHANISM</text><text x="30" y="74" font-size="25" fill="#14213d" text-anchor="start" font-weight="700">基态能量之外：粒子与空穴响应</text><rect x="24" y="98" width="509" height="306" rx="10" fill="#f8faff" stroke="none"/><circle cx="275" cy="221" r="47" fill="#edf3ff" stroke="#2563eb" stroke-width="2"/><text x="275" y="229" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="650">N</text><rect x="70" y="306" width="146" height="64" rx="12" fill="#eee7ff" stroke="#7c3aed"/><rect x="343" y="306" width="146" height="64" rx="12" fill="#e3f3ef" stroke="#087e81"/><text x="143" y="345" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="650">N − 1</text><text x="416" y="345" font-size="16" fill="#087e81" text-anchor="middle" font-weight="650">N + 1</text><line x1="239" y1="258" x2="174" y2="299" stroke="#7c3aed" stroke-width="2.3" /><path d="M 178.37834179936468 291.13678671992574 L 174 299 L 182.98229399261422 298.4357353189799" fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><line x1="311" y1="258" x2="381" y2="299" stroke="#087e81" stroke-width="2.3" /><path d="M 372.00400905358885 298.7313982649198 L 381 299 L 376.3654659146242 291.2850085021764" fill="none" stroke="#087e81" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><text x="174" y="270" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="650">c</text><text x="381" y="270" font-size="16" fill="#087e81" text-anchor="middle" font-weight="650">c†</text><text x="275" y="150" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="650">增减一个粒子的响应</text><circle cx="222" cy="183" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="222" y="188" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">1</text><circle cx="489" cy="304" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="489" y="309" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">2</text><circle cx="72" cy="304" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="72" y="309" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">3</text><text x="560" y="117" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">如何读这张图</text><circle cx="575" cy="147" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="575" y="152" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">1</text><text x="600" y="151" font-size="17" fill="#14213d" text-anchor="start" font-weight="600">N 粒子基态</text><circle cx="575" cy="217" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="575" y="222" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">2</text><text x="600" y="221" font-size="17" fill="#14213d" text-anchor="start" font-weight="600">N+1 粒子扇区</text><circle cx="575" cy="287" r="13" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="575" y="292" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">3</text><text x="600" y="291" font-size="17" fill="#14213d" text-anchor="start" font-weight="600">N−1 空穴扇区</text><line x1="551" y1="344" x2="803" y2="344" stroke="#dce5f3" stroke-width="2" /><text x="560" y="373" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">不按真实几何、时间或能量比例</text><line x1="30" y1="420" x2="810" y2="420" stroke="#dce5f3" stroke-width="2" /