<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="F14-workflow-title F14-workflow-desc"><title id="F14-workflow-title">F14 从研究对象到可核验的结果</title><desc id="F14-workflow-desc">1 量子方法：候选 VQE 态制备；2 量子方法：粒子与空穴种子；3 经典计算：矩与连分式重建；4 测量 / 验证：经典精确谱对照；本案为经典模拟验证</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="838" height="518" rx="16" fill="#fff" stroke="#dce5f3"/><text x="30" y="34" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">F14 / COMPUTE &amp; VALIDATE</text><text x="30" y="74" font-size="25" fill="#14213d" text-anchor="start" font-weight="700">从研究对象到可核验的结果</text><rect x="30" y="113" width="360" height="136" rx="10" fill="#fff" stroke="#dce5f3"/><circle cx="59" cy="141" r="13" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="59" y="146" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="81" y="147" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="650">量子方法</text><text x="51" y="192" font-size="20" fill="#14213d" text-anchor="start" font-weight="650">候选 VQE 态制备</text><line x1="54" y1="216" x2="134" y2="216" stroke="#7c3aed" stroke-width="1.3" /><line x1="54" y1="222" x2="134" y2="222" stroke="#7c3aed" stroke-width="1.3" /><line x1="54" y1="228" x2="134" y2="228" stroke="#7c3aed" stroke-width="1.3" /><rect x="78" y="210" width="20" height="25" rx="2" fill="#ede4ff" stroke="#7c3aed"/><circle cx="116" cy="222" r="3" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="155" y="231" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="500">量子端角色见本案证据</text><rect x="450" y="113" width="360" height="136" rx="10" fill="#fff" stroke="#dce5f3"/><circle cx="479" cy="141" r="13" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="479" y="146" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="501" y="147" font-size="15" fill="#7